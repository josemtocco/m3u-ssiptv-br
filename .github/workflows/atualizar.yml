name: Atualizar lista M3U

on:
  schedule:
    # Executa a cada 6 horas.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-m3u
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Gerar lista M3U
        run: python atualizar.py

      - name: Mostrar resumo
        run: |
          echo "Arquivo gerado:"
          ls -lh lista.m3u
          echo "Entradas:"
          grep -c '^#EXTINF:' lista.m3u || true

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista.m3u
          if git diff --cached --quiet; then
            echo "Nenhuma alteração na lista."
          else
            git commit -m "Atualizar lista M3U"
            git push
          fi
